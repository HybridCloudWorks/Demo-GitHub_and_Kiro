name: 💡 Feature or content request
description: Suggest a new lesson, lab, improvement, or feature.
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make the course or repo better? Tell us about it.
  - type: textarea
    id: problem
    attributes:
      label: What's the need?
      description: What problem would this solve, or what would it improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as concrete as you can.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Course content (lesson)
        - Lab (exercise/grader)
        - Project app
        - CI/CD or repo config
        - Docs site / blog / ADR
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about.
    validations:
      required: false
