name: Deploy Docs to GitHub Pages

# Builds the Docusaurus course site and publishes it to GitHub Pages.
#
# HOSTING: GitHub Pages is free for public repositories. Docusaurus only builds
# static files here; GitHub Pages hosts them. Self-hosting is out of scope.
#
# ONE-TIME REPO SETUP (do this once after forking):
#   Repository → Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# After that, every push to main publishes automatically to:
#   https://<your-username>.github.io/<your-repo>/
#
# The url/baseUrl are injected automatically from the repo this runs in, so a fork
# "just works" with no code edits (see the "Compute Pages URL" step).

on:
  # Publish on every push to main.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compute site URL and base URL
        id: site
        # actions/configure-pages exposes the resolved base_url (e.g.
        # https://user.github.io/repo). Split it into origin (SITE_URL) and
        # path (SITE_BASE_URL, must have a trailing slash) for Docusaurus.
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          ORIGIN="${{ steps.pages.outputs.origin }}"
          PATH_PART="${{ steps.pages.outputs.base_path }}"
          # Ensure trailing slash on the base path for Docusaurus baseUrl.
          case "$PATH_PART" in
            */) : ;;
            *) PATH_PART="${PATH_PART}/" ;;
          esac
          echo "site_url=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "site_base_url=$PATH_PART" >> "$GITHUB_OUTPUT"
          echo "Resolved: url=$ORIGIN baseUrl=$PATH_PART (from $BASE)"

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build Docusaurus site
        working-directory: docs
        env:
          SITE_URL: ${{ steps.site.outputs.site_url }}
          SITE_BASE_URL: ${{ steps.site.outputs.site_base_url }}
          GITHUB_ORG: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke-test the published site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the public URL responds
        # Confirms the deployed, publicly-hosted site is reachable. Retries a few
        # times because Pages propagation can take a moment after deploy.
        run: |
          URL="${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          echo "Checking $URL"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Site is live and reachable."
              exit 0
            fi
            sleep 15
          done
          echo "❌ Site did not return HTTP 200 in time."
          exit 1
