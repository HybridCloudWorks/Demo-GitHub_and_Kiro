name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0

      - name: Run markdownlint
        # Lint course + repo markdown. Docusaurus build output and node_modules are ignored.
        run: >-
          markdownlint
          "**/*.md"
          --ignore node_modules
          --ignore "**/node_modules/**"
          --ignore "docs/build/**"
          --ignore "docs/.docusaurus/**"
