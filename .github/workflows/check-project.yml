name: Check Project (static site)

# Verifies the course project is a valid, internally-consistent static site.
# It has no build step, so "building" means: required files exist, index.html is
# well-formed, and every local asset it references exists.

on:
  push:
    branches: [main]
    paths:
      - "project/**"
      - ".github/workflows/check-project.yml"
  pull_request:
    paths:
      - "project/**"

permissions:
  contents: read

jobs:
  check-static-site:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run static-site sanity check
        run: node project/scripts/check-static-site.js
